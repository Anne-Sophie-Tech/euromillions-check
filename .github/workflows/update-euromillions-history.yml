name: Update EuroMillions history
on:
  schedule:
    - cron: '35 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python scripts/update_euromillions_history.py
      - name: Commit history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/euromillions_history.json
          git diff --cached --quiet || git commit -m 'chore: update EuroMillions history'
          git push
